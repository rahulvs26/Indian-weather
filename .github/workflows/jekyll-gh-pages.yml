# Static deploy to GitHub Pages. Replaces GitHub's default "jekyll-gh-pages" workflow.
#
# WHY THIS FILE IS NOT THE DEFAULT ONE
#
# GitHub offers two Pages options. The one used here was "Deploy with a GitHub Action", which
# scaffolds a workflow built around actions/jekyll-build-pages. That is the wrong tool for this
# repository, and it fails in a way that is invisible until someone loads the 3D map.
#
# Jekyll SKIPS every file whose name starts with an underscore. This site loads three such files
# at runtime:
#
#   data/_mjo-article.mjs   the section 2 Madden-Julian Oscillation article's prose
#   data/_crossings.mjs     reservoir crossings along a dam-release course   (imported by map3d.js)
#   data/_storm-layer.mjs   the catchment-storm layer                        (imported by map3d.js)
#
# The empty .nojekyll file at the repository root does NOT protect against this on the Actions
# route. .nojekyll is a SERVING-layer convention: it tells Pages not to run Jekyll on output it
# is already serving. Here Jekyll runs in the BUILD step, before the artifact is uploaded, so the
# files are stripped on the way into _site and the protection arrives too late. Result: no MJO
# article, no storm layer, no crossings, and map3d.js's ES module graph failing to resolve
# outright - while index.html itself looks perfectly fine.
#
# There is no build step to run. The repository root IS the site. So this workflow checks out the
# tree and uploads it as-is.
#
# data/_smoke.mjs section 11 asserts the .nojekyll file and the underscore dependency, so this
# decision cannot be undone by accident.

name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  # allows a manual re-deploy from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race, and cancel a stale one rather than queueing behind it
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # path: . means the repository root, served verbatim. No Jekyll, no build, no filtering.
      - name: Upload the site as-is
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5